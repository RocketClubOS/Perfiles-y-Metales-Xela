<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Acceso de empleados | Perfiles y Metales Xela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sales.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card">
            <div class="brand-mark">PMX</div>
            <p class="eyebrow">Uso interno</p>
            <h1>Sales Point</h1>
            <p class="muted">Perfiles y Metales Xela</p>

            <form id="loginForm">
                <label>Employee ID
                    <input name="employee_id" autocomplete="username" required maxlength="50">
                </label>
                <label>PIN
                    <input name="pin" type="password" inputmode="numeric"
                           autocomplete="current-password" required maxlength="32">
                </label>
                <button type="submit">Ingresar</button>
                <p class="message" id="loginMessage" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="sales.js"></script>
</body>
</html>
